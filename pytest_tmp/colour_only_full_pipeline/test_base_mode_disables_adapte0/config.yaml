vehicle_enrichment:
  shared_florence:
    enabled: true
    backend: florence2
    base_model_id: D:/project/models/Florence-2-base-ft
    processor_path: D:/project/models/Florence-2-base-ft
    adapter_path: D:/project/models/OCR_MUKUL/OCR_MUKUL/adaptor_florance_baseFT
    adapter_enabled: true
    device: auto
    dtype: auto
    trust_remote_code: true
    attention_implementation: eager
    max_new_tokens: 64
    num_beams: 1
    use_cache: false
    local_files_only: true
    lazy_load: true
  ocr_mukul:
    task_token: "<VQA>"
    prompt: "What is the exterior colour and body type?"
  vehicle_attributes:
    enabled: true
    task_token: "<VQA>"
    prompt: "What is the exterior colour and body type?"
    florence:
      adapter_enabled: false
  diagnostic_separate_attributes:
    enabled: false
    colour:
      task_token: "<VQA>"
      prompt: "What colour is the vehicle?"
      generation:
        max_new_tokens: 16
        num_beams: 1
        do_sample: false
        use_cache: true
        early_stopping: false
    body_vqa:
      task_token: "<VQA>"
      prompt: "What body type is the vehicle?"
      generation:
        max_new_tokens: 16
        num_beams: 1
        do_sample: false
        use_cache: true
        early_stopping: false
    body_detailed_caption:
      task_token: "<MORE_DETAILED_CAPTION>"
      prompt: ""
      generation:
        max_new_tokens: 64
        num_beams: 3
        do_sample: false
        use_cache: true
        early_stopping: true
  plate:
    ocr:
      enabled: true
      task_token: "<OCR>"
      prompt: ""
      florence:
        adapter_enabled: true