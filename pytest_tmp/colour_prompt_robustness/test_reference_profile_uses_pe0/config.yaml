project:
  name: diag_test
  environment: test
  log_level: INFO
input:
  cameras:
  - camera_id: CAM_001
    source_type: video
    source: D:\project\multi-camera-vehicle-tracking\pytest_tmp\colour_prompt_robustness\test_reference_profile_uses_pe0\sample.mp4
    enabled: true
  max_frames_per_camera: 3
ingestion:
  worker_count: 1
  target_read_fps: 10.0
  frame_queue_size: 10
  queue_put_timeout_seconds: 0.1
  queue_get_timeout_seconds: 0.1
  stop_on_camera_error: false
  round_robin: true
  raw_frames:
    enabled: true
    save_every_n_frames: 1
    max_saved_frames_per_camera: 3
    image_format: jpg
    jpeg_quality: 90
detection:
  model_path: D:\project\multi-camera-vehicle-tracking\pytest_tmp\colour_prompt_robustness\test_reference_profile_uses_pe0\model.pt
  device: cpu
  confidence_threshold: 0.38
  iou_threshold: 0.45
  image_size: 640
  agnostic_nms: false
  allowed_classes:
  - car
  - truck
  - bus
  - motorcycle
  - 3wheeler
  bbox_quality:
    enabled: true
    minimum_width_pixels: 20
    minimum_height_pixels: 20
    minimum_area_ratio: 0.005
    maximum_area_ratio: 0.9
    minimum_aspect_ratio: 0.3
    maximum_aspect_ratio: 4.5
    reject_edge_truncated: true
    edge_margin_pixels: 8
tracking:
  backend: supervision_bytetrack
  isolation_mode: per_camera
  supported_isolation_modes:
  - per_camera
  - per_camera_class
  track_activation_threshold: 0.15
  lost_track_buffer: 30
  minimum_matching_threshold: 0.8
  minimum_consecutive_frames: 1
lifecycle:
  minimum_observations: 3
  maximum_lost_frames: 30
  keep_discarded_tracks: true
track_class:
  minimum_observations: 3
  minimum_winner_ratio: 0.6
  strategy: confidence_weighted_majority
  unknown_class_name: UNKNOWN
evidence:
  enabled: true
visualization:
  show_rejected_boxes: false
  detected_frames:
    enabled: true
    save_every_n_frames: 1
    max_saved_frames_per_camera: 3
  tracked_frames:
    enabled: true
    save_every_n_frames: 1
    max_saved_frames_per_camera: 3
output:
  root_directory: outputs/runs
  save_run_config: true
