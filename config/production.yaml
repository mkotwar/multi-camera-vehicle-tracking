project:
  name: multicamera_vehicle_tracking
  environment: production
  log_level: INFO

input:
  cameras:
    - camera_id: CAM_001
      source_type: video
      source: "D:/old_files/vinfocom/traffic_far_video/fa_traff_1min.mp4"
      enabled: true
    - camera_id: CAM_002
      source_type: video
      source: "D:/old_files/vinfocom/traffic_far_video/fa_traff_1min.mp4"
      enabled: false
  max_frames_per_camera: 100

ingestion:
  worker_count: 7
  target_read_fps: 10.0
  frame_queue_size: 200
  queue_put_timeout_seconds: 2.0
  queue_get_timeout_seconds: 1.0
  stop_on_camera_error: false
  round_robin: true
  raw_frames:
    enabled: true
    save_every_n_frames: 10
    max_saved_frames_per_camera: 10
    image_format: jpg
    jpeg_quality: 90

detection:
  backend: ocr_mukul
  model_path: "D:/project/models/best_old.pt"
  device: auto
  dtype: auto
  confidence_threshold: 0.2
  iou_threshold: 0.45
  image_size: 1024
  agnostic_nms: false
  allowed_class_ids: [0, 1, 2, 3, 4]
  bbox_quality:
    enabled: false
    minimum_width_pixels: 60
    minimum_height_pixels: 60
    minimum_area_ratio: 0.005
    maximum_area_ratio: 0.90
    minimum_aspect_ratio: 0.30
    maximum_aspect_ratio: 4.50
    reject_edge_truncated: true
    edge_margin_pixels: 8

tracking:
  backend: ocr_mukul_supervision_bytetrack
  isolation_mode: per_camera
  supported_isolation_modes: [per_camera]
  track_activation_threshold: 0.25
  lost_track_buffer: 150
  minimum_matching_threshold: 0.70
  minimum_consecutive_frames: 3

tracking_roi:
  enabled: true
  mode: rectangle
  rectangle:
    x_min_fraction: 0.0
    y_min_fraction: 0.420
    x_max_fraction: 0.893
    y_max_fraction: 1.0
  anchor: bottom_center

vehicle_identity:
  enabled: true
  conservative:
    enabled: true
    acceptance_threshold: 0.70
    ambiguity_margin: 0.03
    vehicle_consistency_floor: 0.58
  plate_assistance:
    enabled: true
    require_high_quality_for_exact_override: true
    contradiction_veto: true
  stationary_recovery:
    enabled: false

lifecycle:
  minimum_observations: 3
  maximum_lost_frames: 30
  keep_discarded_tracks: true

track_class:
  minimum_observations: 3
  minimum_winner_ratio: 0.60
  strategy: confidence_weighted_majority
  unknown_class_name: UNKNOWN

evidence:
  enabled: true
  collect_first: true
  collect_middle: true
  collect_last: true
  collect_highest_confidence: true
  collect_largest: true
  collect_sharpest: true
  collect_best_overall: true
  maximum_candidates_per_track: 7
  minimum_crop_width_pixels: 40
  minimum_crop_height_pixels: 40
  crop_padding_ratio_x: 0.08
  crop_padding_ratio_y: 0.08
  minimum_padding_pixels: 8
  clamp_bbox_to_frame: true
  reject_invalid_bbox: true
  sharpness_enabled: true
  best_overall_weights:
    confidence: 0.35
    sharpness: 0.25
    bbox_area: 0.20
    centeredness: 0.10
    edge_visibility: 0.10
  jpeg_quality: 90
  save_vehicle_crops: true
  save_annotated_full_frames: true
  save_all_candidates: false
  include_discarded_tracks: false
  fail_pipeline_on_error: false

visualization:
  show_rejected_boxes: false
  detected_frames:
    enabled: true
    save_every_n_frames: 10
    max_saved_frames_per_camera: 20
  tracked_frames:
    enabled: true
    save_every_n_frames: 10
    max_saved_frames_per_camera: 20

output:
  root_directory: outputs/runs
  save_run_config: true

vehicle_enrichment:
  enabled: true
  trigger: track_completed
  florence_mode: current
  fail_open: true
  best_crops_per_track: 3
  write_separate_output: true
  extend_tracks_json: true
  evidence:
    source: existing_track_evidence
    save_vehicle_crops: true
    minimum_crop_width: 100
    minimum_crop_height: 70
    minimum_sharpness: 10.0
    minimum_quality_score: 0.20
    border_margin_ratio: 0.02
    scoring:
      area_weight: 0.25
      sharpness_weight: 0.25
      confidence_weight: 0.20
      role_weight: 0.15
      border_weight: 0.05
      clipping_weight: 0.05
      brightness_weight: 0.05
  shared_florence:
    enabled: true
    backend: florence2
    base_model_id: "D:/project/models/Florence-2-base-ft"
    processor_path: "D:/project/models/Florence-2-base-ft"
    adapter_path: "D:/project/models/OCR_MUKUL/OCR_MUKUL/adaptor_florance_baseFT"
    adapter_enabled: false
    device: auto
    dtype: auto
    trust_remote_code: true
    local_files_only: true
    attention_implementation: eager
    max_new_tokens: 128
    num_beams: 3
    use_cache: false
    lazy_load: true
  vehicle_attributes:
    enabled: true
    backend: base_florence
    maximum_crops_per_track: 3
    reuse_single_response_for_attributes: false
    task_token: "<VQA>"
    prompt: "What colour is the vehicle?"
    florence:
      base_model_id: "D:/project/models/Florence-2-base-ft"
      processor_path: "D:/project/models/Florence-2-base-ft"
      adapter_enabled: false
      adapter_path: ""
      fail_if_adapter_missing: false
      device: auto
      dtype: auto
      local_files_only: true
      lazy_load: true
      max_new_tokens: 16
      num_beams: 1
      use_cache: true
    colour:
      enabled: true
      backend: base_florence
      task_token: "<VQA>"
      prompt: "What colour is the vehicle?"
      generation:
        max_new_tokens: 16
        num_beams: 1
        do_sample: false
        use_cache: true
        early_stopping: false
    body_type:
      enabled: false
      backend: base_florence
      task_token: "<VQA>"
      prompt: ""
      generation:
        max_new_tokens: 16
        num_beams: 1
        do_sample: false
        use_cache: true
        early_stopping: false
  body_type:
    enabled: false
  colour:
    enabled: false
  make_model:
    enabled: false
  plate:
    detection_enabled: true
    colour_enabled: false
    recognition_enabled: true
    detector:
      enabled: true
      model_path: "D:/project/models/OCR_MUKUL/OCR_MUKUL/license_plate_weights.pt"
    ocr:
      enabled: true
      backend: ocr_mukul_adapter
      task_token: "<OCR>"
      prompt: ""
      florence:
        base_model_id: "D:/project/models/Florence-2-base-ft"
        processor_path: "D:/project/models/Florence-2-base-ft"
        adapter_path: "D:/project/models/OCR_MUKUL/OCR_MUKUL/adaptor_florance_baseFT"
        adapter_enabled: true
        fail_if_adapter_missing: true
        device: auto
        dtype: auto
        local_files_only: true
        lazy_load: true
  ocr:
    enabled: false
    run_only_when_plate_detected: true
