project:
  name: multicamera_vehicle_tracking
  environment: validation
  log_level: INFO

input:
  cameras:
    - camera_id: CAM_001
      source_type: video
      source: "D:/old_files/vinfocom/traffic_far_video/fa_traff_1min.mp4"
      enabled: true
    - camera_id: CAM_002
      source_type: video
      source: "D:/old_files/vinfocom/traffic_far_video/fa_traff_1min.mp4"
      enabled: false
  max_frames_per_camera: 100

ingestion:
  worker_count: 2
  target_read_fps: 10.0
  frame_queue_size: 50
  queue_put_timeout_seconds: 2.0
  queue_get_timeout_seconds: 1.0
  stop_on_camera_error: false
  round_robin: true
  raw_frames:
    enabled: true
    save_every_n_frames: 2
    max_saved_frames_per_camera: 2
    image_format: jpg
    jpeg_quality: 90

detection:
  backend: ocr_mukul
  model_path: "D:/project/models/best_old.pt"
  device: auto
  confidence_threshold: 0.2
  iou_threshold: 0.45
  image_size: 1024
  agnostic_nms: false
  allowed_class_ids:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
  bbox_quality:
    enabled: false
    minimum_width_pixels: 60
    minimum_height_pixels: 60
    minimum_area_ratio: 0.005
    maximum_area_ratio: 0.90
    minimum_aspect_ratio: 0.30
    maximum_aspect_ratio: 4.50
    reject_edge_truncated: true
    edge_margin_pixels: 8

tracking:
  backend: ocr_mukul_supervision_bytetrack
  isolation_mode: per_camera
  supported_isolation_modes:
    - per_camera
  track_activation_threshold: 0.3
  lost_track_buffer: 40
  minimum_matching_threshold: 0.6
  minimum_consecutive_frames: 3

lifecycle:
  minimum_observations: 3
  maximum_lost_frames: 30
  keep_discarded_tracks: true

track_class:
  minimum_observations: 3
  minimum_winner_ratio: 0.60
  strategy: confidence_weighted_majority
  unknown_class_name: UNKNOWN

evidence:
  enabled: true
  collect_first: true
  collect_middle: true
  collect_last: true
  collect_highest_confidence: true
  collect_largest: true
  collect_sharpest: true
  collect_best_overall: true
  maximum_candidates_per_track: 7
  minimum_crop_width_pixels: 40
  minimum_crop_height_pixels: 40
  crop_padding_ratio_x: 0.08
  crop_padding_ratio_y: 0.08
  minimum_padding_pixels: 8
  clamp_bbox_to_frame: true
  reject_invalid_bbox: true
  sharpness_enabled: true
  best_overall_weights:
    confidence: 0.35
    sharpness: 0.25
    bbox_area: 0.20
    centeredness: 0.10
    edge_visibility: 0.10
  jpeg_quality: 90
  save_vehicle_crops: true
  save_annotated_full_frames: true
  save_all_candidates: false
  include_discarded_tracks: false
  fail_pipeline_on_error: false
  minimum_frame_gap: 0
  preferred_frame_gap: 8
  deduplicate_similar_crops: false

visualization:
  show_rejected_boxes: false
  detected_frames:
    enabled: true
    save_every_n_frames: 2
    max_saved_frames_per_camera: 2
  tracked_frames:
    enabled: true
    save_every_n_frames: 2
    max_saved_frames_per_camera: 2

output:
  root_directory: outputs/runs
  save_run_config: true

vehicle_enrichment:
  florence_mode: ocr_mukul
  enabled: true
  trigger: track_completed
  fail_open: true
  best_crops_per_track: 3
  write_separate_output: true
  extend_tracks_json: true

  image_size_policy:
    ingestion:
      preserve_source_resolution: true
    detection:
      inference_size: 1024
      preserve_aspect_ratio: true
      resize_mode: letterbox
    evidence_crop:
      preserve_original_crop: true
      context_padding_ratio: 0.08
      clamp_to_frame: true
      store_original_dimensions: true
    florence:
      minimum_original_width: 192
      minimum_original_height: 144
      preferred_original_width: 320
      preferred_original_height: 240
      eligibility_dimensions_source: original_crop
      preserve_aspect_ratio: true
      pad_to_square: true
      square_padding_value: 114
      reject_upscaled_eligibility: true

  evidence_quality:
    minimum_sharpness: 50.0
    minimum_brightness: 35
    maximum_brightness: 225
    maximum_edge_truncation_ratio: 0.15

  evidence:
    source: existing_track_evidence
    save_vehicle_crops: true
    minimum_crop_width: 100
    minimum_crop_height: 70
    minimum_sharpness: 10.0
    minimum_quality_score: 0.20
    border_margin_ratio: 0.02
    scoring:
      area_weight: 0.25
      sharpness_weight: 0.25
      confidence_weight: 0.20
      role_weight: 0.15
      border_weight: 0.05
      clipping_weight: 0.05
      brightness_weight: 0.05

  track_evidence:
    enabled: true
    maximum_candidates_per_track: 12
    final_crops_per_attribute: 3
    minimum_frame_gap: 3
    preferred_frame_gap: 8
    deduplicate_similar_crops: true
    classify_at_track_completion: true
    early_classification:
      enabled: false
      require_preferred_resolution: true
      minimum_quality_score: 0.80

  shared_florence:
    enabled: true
    backend: florence2
    base_model_id: "D:/project/models/Florence-2-base-ft"
    processor_path: "D:/project/models/Florence-2-base-ft"
    adapter_path: "D:/project/models/OCR_MUKUL/OCR_MUKUL/adaptor_florance_baseFT"
    adapter_enabled: true
    fail_if_adapter_missing: true
    device: auto
    dtype: auto
    trust_remote_code: true
    attention_implementation: eager
    max_new_tokens: 64
    num_beams: 1
    use_cache: false
    local_files_only: true
    lazy_load: true

  ocr_mukul:
    enabled: true
    task_token: "<CAPTION>"
    prompt: ""
    reuse_caption_for_attributes: true
    maximum_crops_per_track: 3
    body_type_vehicle_classes:
      - CAR
    colour_vehicle_classes:
      - 3WHEELER
      - BUS
      - CAR
      - MOTORCYCLE
      - TRUCK

  body_type:
    enabled: true
    backend: florence2
    run_only_when_vehicle_class:
      - CAR
    maximum_crops_per_track: 3
    minimum_crop_width: 192
    minimum_crop_height: 144
    allowed_labels:
      - SUV
      - SEDAN
      - HATCHBACK
      - MPV
      - VAN
      - PICKUP
      - OTHER
      - UNKNOWN

  colour:
    enabled: true
    backend: florence2
    prompt_variant: prompt_c
    retry_on_invalid_response: false
    maximum_prompt_attempts: 1
    run_only_when_vehicle_class:
      - 3WHEELER
      - BUS
      - CAR
      - MOTORCYCLE
      - TRUCK
    maximum_crops_per_track: 3
    minimum_crop_width: 192
    minimum_crop_height: 144
    allowed_labels:
      - BLACK
      - WHITE
      - GREY
      - SILVER
      - RED
      - BLUE
      - GREEN
      - YELLOW
      - ORANGE
      - BROWN
      - BEIGE
      - PURPLE
      - OTHER
      - UNKNOWN

  make_model:
    enabled: false

  plate:
    detection_enabled: false
    recognition_enabled: false
    colour_enabled: false

  ocr:
    enabled: false
    run_only_when_plate_detected: true
