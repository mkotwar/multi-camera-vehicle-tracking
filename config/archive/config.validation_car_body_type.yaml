project:
  name: multicamera_vehicle_tracking
  environment: validation
  log_level: INFO

input:
  cameras:
    - camera_id: CAM_001
      source_type: video
      source: "D:/old_files/vinfocom/traffic_far_video/fa_traff_1min.mp4"
      enabled: true
  max_frames_per_camera: 100

ingestion:
  worker_count: 2
  target_read_fps: 10.0
  frame_queue_size: 50
  queue_put_timeout_seconds: 2.0
  queue_get_timeout_seconds: 1.0
  stop_on_camera_error: false
  round_robin: true

detection:
  backend: ocr_mukul
  model_path: "D:/project/models/best_old.pt"
  device: auto
  confidence_threshold: 0.2
  iou_threshold: 0.45
  image_size: 1024
  agnostic_nms: false
  allowed_class_ids: [0, 1, 2, 3, 4, 5, 6, 7]

tracking:
  backend: ocr_mukul_supervision_bytetrack
  isolation_mode: per_camera
  supported_isolation_modes: [per_camera]
  track_activation_threshold: 0.3
  lost_track_buffer: 40
  minimum_matching_threshold: 0.6
  minimum_consecutive_frames: 3

lifecycle:
  minimum_observations: 3
  maximum_lost_frames: 30
  keep_discarded_tracks: true

track_class:
  minimum_observations: 3
  minimum_winner_ratio: 0.60
  strategy: confidence_weighted_majority
  unknown_class_name: UNKNOWN

evidence:
  enabled: true
  collect_first: true
  collect_middle: true
  collect_last: true
  collect_highest_confidence: true
  collect_largest: true
  collect_sharpest: true
  collect_best_overall: true
  maximum_candidates_per_track: 7
  minimum_crop_width_pixels: 40
  minimum_crop_height_pixels: 40
  crop_padding_ratio_x: 0.08
  crop_padding_ratio_y: 0.08
  minimum_padding_pixels: 8
  clamp_bbox_to_frame: true
  reject_invalid_bbox: true
  sharpness_enabled: true
  best_overall_weights:
    confidence: 0.35
    sharpness: 0.25
    bbox_area: 0.20
    centeredness: 0.10
    edge_visibility: 0.10
  jpeg_quality: 90
  save_vehicle_crops: true
  save_annotated_full_frames: true
  save_all_candidates: false
  include_discarded_tracks: false
  fail_pipeline_on_error: false
  capture_zone:
    enabled: false
    default:
      top_ratio: 0.68
      bottom_ratio: 0.85
      trigger_point: bottom_center
      maximum_saved_candidates_per_track: 3
      minimum_frame_gap: 2
      capture_policy: best_quality
      save_immediately: true
      require_confirmed_track: true
      minimum_bbox_width_pixels: 80
      minimum_bbox_height_pixels: 60
      direction_mode: any
    class_specific:
      motorcycle:
        top_ratio: 0.60
        bottom_ratio: 0.82
      3wheeler:
        top_ratio: 0.64
        bottom_ratio: 0.84
      car:
        top_ratio: 0.68
        bottom_ratio: 0.85
      truck:
        top_ratio: 0.68
        bottom_ratio: 0.85
      bus:
        top_ratio: 0.68
        bottom_ratio: 0.85
    cameras:
      CAM_001:
        enabled: true
        default:
          top_ratio: 0.68
          bottom_ratio: 0.85
          trigger_point: bottom_center
          maximum_saved_candidates_per_track: 3
          minimum_frame_gap: 2
          capture_policy: best_quality
          save_immediately: true
          require_confirmed_track: true
          minimum_bbox_width_pixels: 80
          minimum_bbox_height_pixels: 60
          direction_mode: any
        class_specific:
          motorcycle:
            top_ratio: 0.60
            bottom_ratio: 0.82

visualization:
  show_rejected_boxes: false
  detected_frames:
    enabled: true
    save_every_n_frames: 1
    max_saved_frames_per_camera: 5000
  tracked_frames:
    enabled: true
    save_every_n_frames: 1
    max_saved_frames_per_camera: 5000
  capture_zone:
    enabled: true

debug_outputs:
  enabled: true
  extracted_frames:
    enabled: true
    save_every_n_frames: 1
    max_saved_frames_per_camera: 5000
  detected_frames:
    enabled: true
    save_every_n_frames: 1
    max_saved_frames_per_camera: 5000
  tracked_frames:
    enabled: true
    save_every_n_frames: 1
    max_saved_frames_per_camera: 5000
  track_crops:
    enabled: true
    save_every_n_frames: 3
    max_crops_per_track: 100
  florence_selected_crops:
    enabled: true

output:
  root_directory: outputs/runs
  save_run_config: true

vehicle_enrichment:
  enabled: true
  trigger: track_completed
  fail_open: true
  best_crops_per_track: 3
  write_separate_output: true
  extend_tracks_json: true
  florence_mode: current
  image_size_policy:
    florence:
      default:
        minimum_original_width: 192
        minimum_original_height: 144
        preferred_original_width: 320
        preferred_original_height: 240
      class_specific:
        car:
          minimum_original_width: 120
          minimum_original_height: 100
          preferred_original_width: 240
          preferred_original_height: 160
      pad_to_square: true
      square_padding_value: 114
  evidence:
    source: capture_zone_with_existing_fallback
    save_vehicle_crops: true
    minimum_crop_width: 100
    minimum_crop_height: 70
    minimum_sharpness: 10.0
    minimum_quality_score: 0.20
    border_margin_ratio: 0.02
    scoring:
      area_weight: 0.25
      sharpness_weight: 0.25
      confidence_weight: 0.20
      role_weight: 0.15
      border_weight: 0.05
      clipping_weight: 0.05
      brightness_weight: 0.05
  shared_florence:
    enabled: true
    backend: florence2
    base_model_id: "D:/project/models/Florence-2-base-ft"
    processor_path: "D:/project/models/Florence-2-base-ft"
    adapter_enabled: false
    adapter_path: ""
    fail_if_adapter_missing: false
    device: auto
    dtype: auto
    trust_remote_code: true
    attention_implementation: eager
    max_new_tokens: 64
    num_beams: 1
    use_cache: false
    local_files_only: true
    lazy_load: true
  vehicle_attributes:
    enabled: true
    backend: base_florence
    maximum_crops_per_track: 3
    reuse_single_response_for_attributes: false
    colour:
      enabled: true
      task_token: "<VQA>"
      prompt: "What colour is the vehicle?"
      generation:
        max_new_tokens: 16
        num_beams: 1
        do_sample: false
        use_cache: true
        early_stopping: false
    body_type:
      enabled: true
      backend: base_florence
      car_only: true
      run_only_when_vehicle_class: [CAR]
      maximum_crops_per_track: 3
      minimum_original_width: 120
      minimum_original_height: 100
      preferred_original_width: 240
      preferred_original_height: 160
      allowed_labels: [SEDAN, HATCHBACK, SUV, MPV, UNKNOWN]
      task_token: "<VQA>"
      prompt: |-
        What type of car is shown in this image?
        Answer with one word only:
        sedan, hatchback, suv, or mpv.
      generation:
        max_new_tokens: 16
        num_beams: 1
        do_sample: false
        use_cache: true
        early_stopping: false
    florence:
      base_model_id: "D:/project/models/Florence-2-base-ft"
      processor_path: "D:/project/models/Florence-2-base-ft"
      adapter_enabled: false
      adapter_path: ""
      fail_if_adapter_missing: false
      device: auto
      dtype: auto
      local_files_only: true
      lazy_load: true
  body_type:
    enabled: false
  colour:
    enabled: false
  make_model:
    enabled: false
  plate:
    detection_enabled: false
    recognition_enabled: false
    colour_enabled: false
    ocr:
      enabled: false
  ocr:
    enabled: false
    run_only_when_plate_detected: false
